apiVersion: v1
kind: Service
metadata:
  name: travel-blog-api
  namespace: travel-blog
spec:
  selector:
    app.kubernetes.io/name: travel-blog
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-blog-api
  namespace: travel-blog
spec:
  # 无状态，可以随便扩。所有实例共享 Postgres / Redis / S3，没有会话粘性需求。
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: travel-blog
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travel-blog
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 等数据库可连接。没有它，Pod 会在 Postgres 就绪前反复 CrashLoop。
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h travel-blog-postgres -U travelblog -d travelblog; do echo waiting; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: travel-blog-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: travel-blog-config
            - secretRef:
                name: travel-blog-secrets
          # 存活探针不碰依赖：数据库挂了不该把进程重启掉（重启也没用，还会放大故障）
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针检查 Postgres / Redis / 对象存储，任一不可用就摘掉流量
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          lifecycle:
            preStop:
              # 先让 Endpoint 从 Service 摘除，再让进程退出，避免滚动更新时丢请求。
              # 进程自身还会再等 10 秒处理完在途请求。
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            # 服务本身不写任何文件——这正是「无状态」带来的直接好处，
            # 根文件系统可以完全只读。
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 30
---
# 滚动更新/节点维护时保证至少有一个实例在服务
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: travel-blog-api
  namespace: travel-blog
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travel-blog
      app.kubernetes.io/component: api
