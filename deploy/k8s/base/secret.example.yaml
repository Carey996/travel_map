# 敏感配置示例。**不要把这个文件填上真实值后提交。**
#
# 两种用法：
#   A. 部署前手工创建（推荐）
#      kubectl -n travel-blog create secret generic travel-blog-secrets \
#        --from-literal=DATABASE_URL='postgres://travelblog:<强密码>@travel-blog-postgres:5432/travelblog?sslmode=disable' \
#        --from-literal=REDIS_URL='redis://travel-blog-redis:6379/0' \
#        --from-literal=S3_ACCESS_KEY='<access key>' \
#        --from-literal=S3_SECRET_KEY='<secret key>'
#
#   B. 用 External Secrets / Sealed Secrets 从密钥管理服务同步
#
# 下面这份仅用于本地验证，密码与开发环境一致。
apiVersion: v1
kind: Secret
metadata:
  name: travel-blog-secrets
  namespace: travel-blog
type: Opaque
stringData:
  # Postgres StatefulSet 用它初始化数据库；DATABASE_URL 里的密码必须一致
  DB_PASSWORD: "travelblog"
  DATABASE_URL: "postgres://travelblog:travelblog@travel-blog-postgres:5432/travelblog?sslmode=disable"
  REDIS_URL: "redis://travel-blog-redis:6379/0"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
