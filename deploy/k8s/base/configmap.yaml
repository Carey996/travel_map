# 非敏感配置。敏感项（连接串、密钥）在 Secret 里。
apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-blog-config
  namespace: travel-blog
data:
  ENVIRONMENT: "prod"
  APP_VERSION: "0.3.0"

  # 会话存 Redis；会话本身是临时数据，因此 Redis 用 Deployment 即可，无需持久化
  SESSION_BACKEND: "redis"
  SESSION_COOKIE_NAME: "tb_session"
  SESSION_TTL_SECONDS: "2592000"
  # 生产必须为 true（走 HTTPS）。用 Ingress + cert-manager 时置 true。
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "lax"

  # 前端与 API 同源（由 web 的 nginx 反代），因此白名单只需列出对外域名
  CORS_ORIGINS: "http://travel-blog.local"

  # 对象存储：后端调用走集群内 Service，浏览器直传必须走对外地址
  S3_ENDPOINT_URL: "http://travel-blog-minio:9000"
  S3_PUBLIC_ENDPOINT_URL: "http://minio.travel-blog.local"
  S3_BUCKET: "travelblog"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"
  S3_PRESIGN_EXPIRES: "3600"

  GEOCODE_PROVIDER: "photon"
  PHOTON_BASE_URL: "https://photon.komoot.io"

  # 多副本时禁止各自跑迁移，改由 migrate Job 负责（见 migrate-job.yaml）
  MIGRATE_ON_START: "false"
